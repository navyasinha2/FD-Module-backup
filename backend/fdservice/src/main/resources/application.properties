spring.application.name=fdservice

# Group 2 hasn't shipped their Product & Pricing service yet, so
# ProductPricingClientStub stands in (see its javadoc). Flip this to false and
# set the base-url below once G2 has something running.
fd.clients.product-pricing.stub-mode=true

# Group 2 (Product & Pricing) service base URL, used by ProductPricingClient
# once fd.clients.product-pricing.stub-mode=false
fd.clients.product-pricing.base-url=http://localhost:8082/products/v1

# Frontend dev server origin(s) allowed to call this API cross-origin (CORS).
# Comma-separated if there's ever more than one.
fd.cors.allowed-origins=http://localhost:3000

# Branch code used to generate account numbers when the request itself carries no
# branch (CreateFdAccountRequest has no branch field per the OpenAPI spec). A
# FD_ACCOUNT_SEQUENCE row must exist for this branch code (seeded on startup if missing).
fd.account-number.default-branch-cd=001

# ---------------------------------------------------------------------------
# Interest calculation
# ---------------------------------------------------------------------------
# FDA_INT_TYP when neither the create request nor the G2 product supplies one, and for
# older rows booked with FDA_INT_TYP = NULL. SIMPLE or COMPOUND.
fd.interest.default-interest-type=COMPOUND

# FDA_DAY_COUNT_CONV snapshotted onto new accounts. ACT/ACT = days in a leap year / 366,
# other days / 365 (existing accounts keep the convention they were booked with). ACT/365 also supported.
fd.interest.day-count-convention=ACT/ACT

# Premature withdrawal (handoff option A): percent of lifetime interest, including
# SIMPLE interest already paid out, plus a flat fee. No minimum holding period.
# Round the combined fee once (currency decimals, HALF_UP), capped at available balance.
fd.premature-withdrawal.penalty-pct=1.00
fd.premature-withdrawal.flat-fee=0.00

# ---------------------------------------------------------------------------
# Business clock + batch
# ---------------------------------------------------------------------------
fd.business-clock.entity-cd=FD
# Initial business date when FD_BUSINESS_CLOCK has no row yet (yyyy-MM-dd); blank = today.
fd.business-clock.seed-date=
# Roll the business date forward one day after a successful EOD cycle.
fd.business-clock.auto-advance-after-eod=true

# Nightly EOD (ACCRUAL then MATURITY) at 12:00 am — second minute hour day month weekday.
# The cycle processes the business date that just ended (at 00:00 on 14 Sep it accrues
# 13 Sep's interest), then advances it; missed dates are replayed in order. Every day is
# a business day.
fd.batch.scheduler.enabled=true
fd.batch.eod-cron=0 0 0 * * *
fd.batch.eod-zone=Asia/Kolkata
# Retries per account for transient DB errors (lock timeouts, deadlocks).
fd.batch.retry-limit=3
# Accounts a single run may skip before the whole run is FAILED.
fd.batch.skip-limit=1000

# Jobs are started explicitly (scheduler / API), never automatically at startup.
spring.batch.job.enabled=false

# ---------------------------------------------------------------------------
# GL accounts posted to (seeded into FD_GL_ACCOUNTS on startup if missing)
# ---------------------------------------------------------------------------
fd.gl.deposit-liability=FD_DEP_LIAB
fd.gl.interest-expense=FD_INT_EXP
fd.gl.interest-payable=FD_INT_PAYABLE
fd.gl.settlement=FD_SETTLEMENT
fd.gl.penalty-income=FD_PENALTY_INC
fd.gl.currency=INR

# MySQL connection. Put machine-specific credentials in config/application.properties
# next to pom.xml (git-ignored) rather than editing these.
spring.datasource.url=jdbc:mysql://localhost:3306/fd_db
spring.datasource.username=root
spring.datasource.password=password

# Services map entities to DTOs inside their own transactions; no lazy loading during rendering.
spring.jpa.open-in-view=false

# Hibernate: auto-create/update tables from entities (dev only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
