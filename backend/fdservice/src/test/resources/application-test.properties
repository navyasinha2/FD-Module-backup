# Test profile (activated for every test by surefire in pom.xml).
# Tests run against a real MySQL schema, separate from the dev fd_db.
# Surefire groups classpath and external config locations at the same level so
# this profile overrides local base settings while inheriting local credentials.
spring.datasource.url=jdbc:mysql://localhost:3306/fd_db_test?createDatabaseIfNotExist=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# No cron during tests; tests drive EOD explicitly.
fd.batch.scheduler.enabled=false
fd.business-clock.seed-date=2026-01-01
